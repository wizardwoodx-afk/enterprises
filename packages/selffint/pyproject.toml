[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "selffint"
version = "1.0.0"
description = "SelfFint — the finance surface for Beyond: an ERPNext connector, a local mirror, and the reports a finance team actually reads."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
keywords = ["finance", "erp", "gst", "receivables", "payroll", "desktop", "beyond"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Financial and Insurance Industry",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Office/Business :: Financial :: Accounting",
]
# No runtime dependencies, deliberately: SelfFint is mounted into someone
# else's gateway and must not drag a web framework or an HTTP library into its
# import graph. The Frappe client is built on urllib.
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
selffint = "selffint.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/selffint"]

[tool.pytest.ini_options]
testpaths = ["tests"]
